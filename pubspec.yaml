name: keihi
description: "Scan printed receipts and track spending with on-device OCR and Gemini categorisation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.1.0
  firebase_ai: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Run `dart run flutter_launcher_icons` after adding assets/icon/icon.png (1024x1024 PNG).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
